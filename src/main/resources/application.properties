spring.application.name=ApexGrid
server.port=${PORT:8080}

# Aiven Cloud MySQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-162e3cb2-nikunjsankhlae243444.g.aivencloud.com:19294/apexgrid?sslMode=REQUIRED&serverTimezone=UTC&connectTimeout=30000&socketTimeout=60000&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${AIVEN_DB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Force Hibernate Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hikari Connection Pool Tuning
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

